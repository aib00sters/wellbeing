plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.wellbeing.wellbeingappUs'
    compileSdk 35
    ndkVersion "27.0.12077973"
    buildToolsVersion "35.0.0"  // Added for SDK 35

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11  // Updated from VERSION_1_8
        targetCompatibility JavaVersion.VERSION_11  // Updated from VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '11'  // Updated from '1.8'
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-Xuse-k2"  // Use K2 compiler for better compatibility
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.wellbeing.wellbeingappUs"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
    }

    // Add this block for better compatibility
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation platform('com.google.firebase:firebase-bom:33.6.0')  // Updated to latest
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.appcompat:appcompat:1.7.0'  // Updated
    implementation 'com.google.android.material:material:1.12.0'  // Updated
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Remove explicit firebase-messaging version to use BOM version
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    //implementation 'com.arthenica:ffmpeg-kit-full:5.1'
}